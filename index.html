<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..."
                    class="task-input"
                >
            </div>
            <div class="input-row">
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <input 
                    type="date" 
                    id="dueDateInput" 
                    class="date-input"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
            <button class="filter-btn" data-filter="medium">Medium Priority</button>
            <button class="filter-btn" data-filter="low">Low Priority</button>
        </div>

        <div class="stats-section">
            <span class="stat">Total: <strong id="totalCount">0</strong></span>
            <span class="stat">Completed: <strong id="completedCount">0</strong></span>
            <span class="stat">Remaining: <strong id="remainingCount">0</strong></span>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>No tasks yet. Add one to get started! 🎯</p>
        </div>

        <button id="clearCompleted" class="clear-btn">Clear Completed Tasks</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
